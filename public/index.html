<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MythForge AI</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      min-height: 100vh;
      background: #0b0b12;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 650px;
      text-align: center;
    }

    .logo {
      font-size: 42px;
      font-weight: bold;
      margin-bottom: 10px;
      letter-spacing: 1px;
    }

    .subtitle {
      color: #aaa;
      margin-bottom: 35px;
      font-size: 16px;
    }

    .card {
      background: #151521;
      border: 1px solid #29293a;
      border-radius: 20px;
      padding: 25px;
      text-align: right;
    }

    label {
      display: block;
      margin-bottom: 10px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 15px;
      border-radius: 12px;
      border: 1px solid #333348;
      background: #0d0d16;
      color: white;
      font-size: 16px;
      margin-bottom: 15px;
      outline: none;
    }

    input:focus {
      border-color: #777;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: white;
      color: #111;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    #result {
      margin-top: 20px;
      padding: 18px;
      background: #0d0d16;
      border-radius: 12px;
      display: none;
      line-height: 1.8;
      white-space: pre-wrap;
      text-align: right;
    }

    .error {
      color: #ff7777;
    }

    .loading {
      color: #aaa;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">MYTHFORGE AI</div>

    <div class="subtitle">
      اصنع نصوصًا أسطورية مذهلة بالذكاء الاصطناعي
    </div>

    <div class="card">

      <label for="character">
        الشخصية الأسطورية
      </label>

      <input
        id="character"
        type="text"
        placeholder="مثال: كلكامش"
        autocomplete="off"
      >

      <button id="generateBtn" onclick="generateScript()">
        توليد النص
      </button>

      <div id="result"></div>

    </div>

  </div>

  <script>
    async function generateScript() {

      const character =
        document.getElementById("character").value.trim();

      const button =
        document.getElementById("generateBtn");

      const result =
        document.getElementById("result");

      if (!character) {
        result.style.display = "block";
        result.className = "error";
        result.textContent =
          "يرجى إدخال اسم شخصية أسطورية.";
        return;
      }

      button.disabled = true;
      button.textContent = "جاري التوليد...";

      result.style.display = "block";
      result.className = "loading";
      result.textContent =
        "الذكاء الاصطناعي يكتب النص...";

      try {

        const response = await fetch("/api/generate", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            character: character
          })
        });

        const data = await response.json();

        if (!response.ok) {

          const details =
            data.details
              ? JSON.stringify(data.details, null, 2)
              : "";

          throw new Error(
            (data.error || "حدث خطأ غير معروف.") +
            "\n\n" +
            details
          );
        }

        if (!data.script) {
          throw new Error(
            "لم يتم استلام نص من الذكاء الاصطناعي."
          );
        }

        result.className = "";
        result.textContent = data.script;

      } catch (error) {

        result.className = "error";

        result.textContent =
          "خطأ:\n\n" + error.message;

      } finally {

        button.disabled = false;
        button.textContent = "توليد النص";

      }
    }
  </script>

</body>
</html>
